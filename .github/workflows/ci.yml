name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # Backend Jobs
  # =============================================================================
  
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Set up Python
        run: uv python install 3.12
      
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      
      - name: Run ruff check
        run: uv run ruff check src/
      
      - name: Run ruff format check
        run: uv run ruff format --check src/

  backend-typecheck:
    name: Backend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Set up Python
        run: uv python install 3.12
      
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      
      - name: Run mypy
        run: uv run mypy src/

  backend-tests:
    name: Backend Tests (${{ matrix.test_suite }}${{ matrix.slicer_total != '' && format(' {0}/{1}', matrix.slicer_index, matrix.slicer_total) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Unit tests split into 3 parallel slices
          - test_suite: unit
            slicer_total: "3"
            slicer_index: "0"
          - test_suite: unit
            slicer_total: "3"
            slicer_index: "1"
          - test_suite: unit
            slicer_total: "3"
            slicer_index: "2"
          # Models and core tests run as single jobs
          - test_suite: models
            slicer_total: ""
            slicer_index: ""
          - test_suite: core
            slicer_total: ""
            slicer_index: ""
    defaults:
      run:
        working-directory: backend
    services:
      jj-mock:
        image: vedrouniverse/jj:2.10.0
        env:
          PORT: "8080"
        ports:
          - 8080:8080
    env:
      JJ_MOCK_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: |
          SLICER_ARGS=""
          if [ -n "${{ matrix.slicer_total }}" ]; then
            SLICER_ARGS="--slicer-total=${{ matrix.slicer_total }} --slicer-index=${{ matrix.slicer_index }}"
          fi
          # shellcheck disable=SC2086 # Intentional word splitting for multiple args
          uv run vedro run scenarios/${{ matrix.test_suite }}/ --verbose $SLICER_ARGS

  backend-migrations:
    name: Backend Migrations Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Set CI auth env
        run: |
          echo "GITLAB_QUEUE_DATABASE_URL=postgresql+asyncpg://test:test@localhost:5432/test_db" >> "$GITHUB_ENV"
          echo "GITLAB_QUEUE_GITLAB_PROJECT_ID=1" >> "$GITHUB_ENV"
          echo "GITLAB_QUEUE_GITLAB_TOKEN=ci-placeholder-token" >> "$GITHUB_ENV"
          echo "GITLAB_QUEUE_JWT_SECRET=$(openssl rand -hex 64)" >> "$GITHUB_ENV"

      - name: Check Alembic - single head
        run: |
          HEADS=$(uv run alembic heads | wc -l)
          if [ "$HEADS" -ne 1 ]; then
            echo "ERROR: Multiple Alembic heads detected!"
            uv run alembic heads
            exit 1
          fi
          echo "OK: Single Alembic head"

      - name: Check Alembic - migrations apply
        run: |
          uv run alembic upgrade head
          echo "OK: All migrations applied successfully"

      - name: Check Alembic - downgrade works
        run: |
          # Test full downgrade/upgrade cycle to ensure all migrations are reversible
          uv run alembic downgrade base
          uv run alembic upgrade head
          echo "OK: All migrations are reversible"

  # =============================================================================
  # Frontend Jobs
  # =============================================================================
  
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run Prettier check
        run: npm run format -- --check

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run TypeScript check
        run: npm run type-check

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm run test:run
      
      - name: Run tests with coverage
        run: npm run test:coverage

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build

  # =============================================================================
  # Docker Build Verification
  # =============================================================================
  
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Summary Job (requires all others to pass)
  # =============================================================================
  
  ci-success:
    name: CI Success
    needs:
      - backend-lint
      - backend-typecheck
      - backend-tests
      - backend-migrations
      - frontend-lint
      - frontend-typecheck
      - frontend-tests
      - frontend-build
      - docker-build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend-lint.result }}" != "success" ]] || \
             [[ "${{ needs.backend-typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.backend-tests.result }}" != "success" ]] || \
             [[ "${{ needs.backend-migrations.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-lint.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-tests.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-build.result }}" != "success" ]] || \
             [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI jobs passed!"
