repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && uv run mypy src/'
        language: system
        types: [python]
        pass_filenames: false

      - id: pyscn
        name: pyscn
        entry: bash -c 'cd backend && pyscn check --select complexity,deadcode --skip-clones src/'
        language: system
        types: [python]
        pass_filenames: false
