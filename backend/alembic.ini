# Alembic configuration for GitLab Merge Queue Bot
# https://alembic.sqlalchemy.org/

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# Timezone to use when rendering the date in the migration file.
# If not specified, the default rendered date will be in UTC.
# timezone =

# Max length of characters to apply to "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without source
# sourceless = false

# Version path separator
# version_path_separator = os
# version_path_separator = :
# version_path_separator = ;

# Output encoding used when writing files
output_encoding = utf-8

# SQLAlchemy URL - will be overridden by env.py using config.py settings
# Use absolute path for Docker container
sqlalchemy.url = sqlite+aiosqlite:////app/data/queue.db


[post_write_hooks]
# Ruff formatting hook for generated migration files
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
