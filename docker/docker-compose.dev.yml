services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: gitlab-queue-backend-dev
    working_dir: /app
    env_file:
      - ../backend/.env
    environment:
      PATH: /app/.venv/bin:$PATH
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      WATCHFILES_FORCE_POLLING: "1"
      GITLAB_QUEUE_WEBHOOK_HOST: "0.0.0.0"
      GITLAB_QUEUE_DATABASE_URL: "sqlite+aiosqlite:///app/data/queue.db"
      GITLAB_QUEUE_CORS_ORIGINS: "http://localhost:5173"
    command: >
      sh -c "uv sync --frozen --dev && ./scripts/dev.sh"
    volumes:
      - ../backend:/app
      - backend-venv:/app/.venv
      - queue-data-dev:/app/data
    ports:
      - "8080:8080"

  frontend:
    image: node:22-alpine
    container_name: gitlab-queue-frontend-dev
    working_dir: /app
    environment:
      VITE_API_URL: http://backend:8080
      VITE_WS_URL: ws://backend:8080
      VITE_APP_NAME: MergeBot
      VITE_APP_VERSION: dev
      CHOKIDAR_USEPOLLING: "true"
    command: >
      sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ../frontend:/app
      - frontend-node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

volumes:
  queue-data-dev:
  backend-venv:
  frontend-node_modules:
