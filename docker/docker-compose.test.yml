# Docker Compose for running tests with JJ Mock Server
# Usage:
#   docker compose -f docker/docker-compose.test.yml up --build --abort-on-container-exit
#   docker compose -f docker/docker-compose.test.yml down

services:
  jj-mock:
    image: vedrouniverse/jj:2.10.0
    container_name: jj-mock-server
    environment:
      JJ_LOG_FORMAT: "-> $$req_method $$req_path?$$req_query\n<- $$res_code $$res_reason\n"
      PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__jj__/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  tests:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.test
    container_name: gitlab-queue-tests
    depends_on:
      jj-mock:
        condition: service_healthy
    environment:
      - JJ_MOCK_URL=http://jj-mock:8080
      - DATABASE_URL="sqlite+aiosqlite:///:memory:"
      - GITLAB_QUEUE_GITLAB_URL=http://jj-mock:8080
      - GITLAB_QUEUE_GITLAB_TOKEN=test-token
      - GITLAB_QUEUE_GITLAB_PROJECT_ID=123
      - GITLAB_QUEUE_JWT_SECRET=test-secret
      - GITLAB_QUEUE_WEBHOOK_SECRET=test-webhook-secret
    command: ["uv", "run", "vedro", "run", "scenarios/"]
    volumes:
      # Mount scenarios for faster iteration during development
      - ../backend/scenarios:/app/scenarios:ro
